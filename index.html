const cats=['گیم‌پلی','داستان','گرافیک هنری','گرافیک فنی','موسیقی'],LS='bc_score_demo_ratings_v2',NAME='bc_demo_name';
const fmt=n=>new Intl.NumberFormat('fa-IR').format(n), g=id=>games.find(x=>x.id===id), saved=()=>JSON.parse(localStorage.getItem(LS)||'[]'), setSaved=a=>localStorage.setItem(LS,JSON.stringify(a));
function userRatings(id){return saved().filter(r=>r.gameId===id)}function aggregate(x){const a=userRatings(x.id);if(!a.length)return{score:x.score,ratings:x.ratings,cats:x.cats,hours:x.hours};return{score:a.reduce((s,r)=>s+r.overall,0)/a.length,ratings:x.ratings+a.length,cats:cats.map((_,i)=>a.reduce((s,r)=>s+r.scores[i],0)/a.length),hours:a.reduce((s,r)=>s+r.hours,0)/a.length}}
function card(x){let a=aggregate(x);return `<div class="game" onclick="go('game:${x.id}')"><div class="cover"><img src="${x.img}"><div class="scoreBadge"><b>${a.score.toFixed(1)}</b><span>/10 · ${fmt(a.ratings)}</span></div></div><div class="gname">${x.name}</div><div class="gmeta">${x.year}</div></div>`}
function section(t,s,arr){return `<section class="section"><div class="head"><div><h2>${t}</h2><p>${s}</p></div><button class="more" onclick="go('discover')">مشاهده همه</button></div><div class="gameRow">${arr.map(card).join('')}</div></section>`}
function home(){let newest=[...games].sort((a,b)=>b.year-a.year).slice(0,8),popular=[...games].sort((a,b)=>b.ratings-a.ratings).slice(0,8),top=[...games].sort((a,b)=>aggregate(b).score-aggregate(a).score).slice(0,8),contro=[games[7],games[18],games[15],games[16],games[12],games[1],games[8],games[2]];
let acts=[['Armin','clair',9.4,'۲ دقیقه پیش'],['Sara','re9',8.7,'۸ دقیقه پیش'],['Z-fan','rdr2',9.8,'۱۷ دقیقه پیش'],['Milad','elden',9.5,'۲۸ دقیقه پیش'],['Nima','prag',8.3,'۴۱ دقیقه پیش']];
let revs=[['Mahdi','clair',9.5,'مبارزات و موسیقی واقعاً فوق‌العاده‌اند و طراحی هنری بازی یکی از بهترین چیزهایی بود که امسال دیدم.'],['Armin','re9',8.7,'فضاسازی و گرافیک هنری خیلی خوبه و ریتم بازی تا اینجای کار منظم پیش میره.'],['Sara','bg3',9.6,'آزادی عمل و واکنش دنیا به انتخاب‌های بازیکن باعث میشه هر بار تجربه متفاوتی داشته باشی.']];
return `<div class="topline"><div><h1>امتیاز کاربران بازی‌سنتر</h1><p>بازی را پیدا کن، امتیاز بده و نقدت را با یک قالب آماده در انجمن منتشر کن.</p></div><div class="quick"><button onclick="go('discover')">همه بازی‌ها</button><button onclick="go('rankings')">رتبه‌بندی‌ها</button><button onclick="go('my')">امتیازهای من</button></div></div>
${section('بازی‌های جدید','تازه‌ترین عناوین موجود در آرشیو',newest)}
<section class="section"><div class="head"><div><h2>آخرین فعالیت کاربران</h2><p>امتیازهای تازه ثبت‌شده در جامعه</p></div></div><div class="activityGrid"><div class="feed">${acts.map(a=>{let x=g(a[1]);return `<div class="feedItem"><div class="feedAvatar">${a[0][0]}</div><div class="feedMain"><b>${a[0]}</b> به <span class="feedGame">${x.name}</span> امتیاز داد<span class="feedTime">${a[3]}</span></div><div class="feedScore">${a[2]}</div></div>`}).join('')}</div><div class="sidePanel"><h3>بالاترین امتیاز این هفته</h3>${top.slice(0,5).map((x,i)=>`<div class="rankMini" onclick="go('game:${x.id}')"><div class="rankNo">#${i+1}</div><img src="${x.img}"><div class="rankName">${x.name}</div><div class="rankScore">${aggregate(x).score.toFixed(1)}</div></div>`).join('')}</div></div></section>
${section('محبوب‌ترین بازی‌ها','بر اساس تعداد رأی‌های ثبت‌شده',popular)}
<section class="section"><div class="head"><div><h2>بحث‌برانگیزترین‌ها</h2><p>بازی‌هایی که معمولاً نظر کاربران درباره‌شان اختلاف بیشتری دارد</p></div></div><div class="gameRow">${contro.map(card).join('')}</div></section>
<section class="section"><div class="head"><div><h2>رتبه‌بندی کاربران</h2><p>نگاهی فشرده‌تر به بالاترین میانگین‌ها</p></div><button class="more" onclick="go('rankings')">رتبه‌بندی کامل</button></div><div class="split"><div class="rankTable">${top.slice(0,6).map((x,i)=>`<div class="rankRow" onclick="go('game:${x.id}')"><div class="rankNo">#${i+1}</div><img src="${x.img}"><div><div class="rn">${x.name}</div><div class="rv">${fmt(aggregate(x).ratings)} رأی</div></div><div class="rv">${x.year}</div><div class="rs">${aggregate(x).score.toFixed(1)}</div></div>`).join('')}</div><div class="sidePanel"><h3>آمار سریع جامعه</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="info"><span>بازی‌های آرشیو</span><b>${fmt(games.length)}</b></div><div class="info"><span>رأی‌های نمونه</span><b>${fmt(games.reduce((s,x)=>s+x.ratings,0))}</b></div><div class="info"><span>میانگین کل</span><b>۸.۹ / ۱۰</b></div><div class="info"><span>کاربر فعال امروز</span><b>۱۱۲</b></div></div></div></div></section>
<section class="section"><div class="head"><div><h2>آخرین نقدها</h2><p>نظرهای کوتاه کاربران درباره بازی‌هایی که تجربه کرده‌اند</p></div></div><div class="reviewCards">${revs.map(r=>{let x=g(r[1]);return `<div class="review"><div class="reviewTop"><img src="${x.img}"><div><div class="reviewGame">${x.name}</div><div class="reviewUser">${r[0]}</div></div><div class="reviewScore">${r[2]}</div></div><p>${r[3]}</p></div>`}).join('')}</div></section>`}
function discover(){return `<div class="topline"><div><h1>همه بازی‌ها</h1><p>${games.length} عنوان در نسخه فعلی دمو</p></div></div><div class="gameRow">${games.map(card).join('')}</div>`}
function rankings(){let arr=[...games].sort((a,b)=>aggregate(b).score-aggregate(a).score);return `<div class="topline"><div><h1>رتبه‌بندی کاربران</h1><p>مرتب‌شده بر اساس میانگین امتیاز جامعه</p></div></div><div class="rankTable">${arr.map((x,i)=>`<div class="rankRow" onclick="go('game:${x.id}')"><div class="rankNo">#${i+1}</div><img src="${x.img}"><div><div class="rn">${x.name}</div><div class="rv">${fmt(aggregate(x).ratings)} رأی</div></div><div class="rv">${x.year}</div><div class="rs">${aggregate(x).score.toFixed(1)}</div></div>`).join('')}</div>`}
function gamePage(id){let x=g(id);if(!x)return home();let a=aggregate(x),mine=userRatings(id);return `<div class="gameHero"><div class="poster"><img src="${x.img}"></div><div><div style="display:flex;justify-content:space-between;gap:14px;align-items:start"><div><h1 class="title">${x.name}</h1><div style="font-size:.72rem;color:var(--muted)">${x.genres.join('، ')}</div></div><button class="btn" onclick="go('rate:${x.id}')">ثبت امتیاز</button></div><p class="summary">${x.summary}</p><div class="infoGrid"><div class="info"><span>تاریخ انتشار</span><b>${x.release}</b></div><div class="info"><span>سازنده</span><b class="en">${x.dev}</b></div><div class="info"><span>ناشر</span><b class="en">${x.pub}</b></div><div class="info"><span>ژانر</span><b>${x.genres.join('، ')}</b></div><div class="info"><span>حالت بازی</span><b>${x.modes}</b></div><div class="info"><span>میانگین زمان تجربه</span><b>${a.hours.toFixed(1)} ساعت</b></div></div><div class="tags">${x.platforms.map(p=>`<span class="tag">${p}</span>`).join('')}</div><div class="scoreBoard"><div class="big"><b>${a.score.toFixed(1)}</b><small>بر اساس ${fmt(a.ratings)} رأی</small></div><div class="bars">${cats.map((c,i)=>`<div class="barRow"><span>${c}</span><div class="bar"><div class="fill" style="width:${a.cats[i]*10}%"></div></div><span class="barNum">${a.cats[i].toFixed(1)}</span></div>`).join('')}</div></div>${mine.length?`<div class="saved show">شما برای این بازی ${mine.length} امتیاز آزمایشی ثبت کرده‌اید.</div>`:''}</div></div>`}
function ratePage(id){let x=g(id),nm=localStorage.getItem(NAME)||'Guest';return `<div class="rateBox"><div class="rateHead"><img src="${x.img}"><div><div class="rateTitle">${x.name}</div><div style="font-size:.68rem;color:var(--muted);margin-top:4px">ثبت امتیاز برای ${nm}</div></div><div class="live"><b id="overall">8.4</b><span>امتیاز نهایی / 10</span></div></div><div class="form"><div class="formSec"><h3>پلتفرم‌هایی که بازی کرده‌اید</h3><div class="selects" id="plats">${x.platforms.map((p,i)=>`<button class="sel ${i===0?'on':''}" onclick="this.classList.toggle('on')">${p}</button>`).join('')}</div></div><div class="formSec"><h3>وضعیت تجربه</h3><div class="selects" id="status"><button class="sel on" onclick="pick(this,'#status')">تمام‌شده</button><button class="sel" onclick="pick(this,'#status')">در حال تجربه</button><button class="sel" onclick="pick(this,'#status')">رهاشده</button></div></div><div class="formSec"><h3>زمان تجربه</h3><input id="hours" class="field" type="number" value="24" min="0" style="width:130px"> ساعت</div><div class="formSec"><h3>امتیاز بخش‌ها</h3>${cats.map((n,i)=>`<div class="sl"><label>${n}</label><input class="scoreSlider" type="range" min="0" max="10" step="0.5" value="${[8.5,8,9,8,8.5][i]}" oninput="updateScores()"><span class="slval">${[8.5,8,9,8,8.5][i].toFixed(1)}</span></div>`).join('')}</div><div class="formSec"><h3>نقد شما</h3><textarea id="review" class="field textarea" placeholder="نظر خود را درباره بازی بنویسید..."></textarea></div><div style="display:flex;justify-content:flex-end;gap:8px;padding-top:15px"><button class="chip" onclick="go('game:${x.id}')">انصراف</button><button class="btn" onclick="saveRating('${x.id}')">ثبت امتیاز و ساخت BBCode</button></div><div id="savedMsg" class="saved"></div></div></div>`}
function saveRating(id){let x=g(id),sl=[...document.querySelectorAll('.scoreSlider')],scores=sl.map(e=>+e.value),overall=scores.reduce((a,b)=>a+b,0)/scores.length,platforms=[...document.querySelectorAll('#plats .on')].map(e=>e.textContent),status=document.querySelector('#status .on')?.textContent||'',hours=+document.getElementById('hours').value||0,review=document.getElementById('review').value.trim(),username=localStorage.getItem(NAME)||'Guest';let arr=saved();arr.push({id:Date.now().toString(36),gameId:id,username,platforms,status,hours,scores,overall,review,createdAt:new Date().toISOString()});setSaved(arr);let base=location.href.split('#')[0],gameUrl=base+'#game:'+id,bb=`[CENTER][URL='${gameUrl}'][IMG]${x.img}[/IMG][/URL]\n\n[URL='${gameUrl}'][B]${x.name}[/B][/URL]\n[B]امتیاز نهایی: ${overall.toFixed(1)}/10[/B][/CENTER]\n\n[B]گیم‌پلی:[/B] ${scores[0].toFixed(1)}\n[B]داستان:[/B] ${scores[1].toFixed(1)}\n[B]گرافیک هنری:[/B] ${scores[2].toFixed(1)}\n[B]گرافیک فنی:[/B] ${scores[3].toFixed(1)}\n[B]موسیقی:[/B] ${scores[4].toFixed(1)}\n\n[B]پلتفرم:[/B] ${platforms.join(', ')}\n[B]زمان تجربه:[/B] ${hours} ساعت\n[B]وضعیت:[/B] ${status}\n\n${review}\n\n[B][جهت ثبت در پست اول][/B]`;window.__bb=bb;let box=document.getElementById('savedMsg');box.classList.add('show');box.innerHTML=`<b>ثبت شد.</b> امتیاز در این مرورگر ذخیره شد.<br><br><button class="btn" onclick="copyBB()">کپی BBCode برای انجمن</button><textarea id="bbcode" class="field bb">${bb.replace(/</g,'&lt;')}</textarea><br><button class="chip" onclick="go('game:${id}')">مشاهده صفحه بازی</button>`}
async function copyBB(){await navigator.clipboard.writeText(window.__bb||'');alert('BBCode کپی شد')}
function myPage(){let a=saved();if(!a.length)return '<div class="saved show">هنوز در این مرورگر امتیازی ثبت نشده است.</div>';return `<div class="topline"><div><h1>امتیازهای من</h1><p>داده‌های ثبت‌شده در همین مرورگر</p></div></div><div class="rankTable">${a.slice().reverse().map((r,i)=>{let x=g(r.gameId);return `<div class="rankRow"><div class="rankNo">#${i+1}</div><img src="${x.img}"><div><div class="rn">${x.name}</div><div class="rv">${r.platforms.join('، ')} · ${r.hours} ساعت</div></div><div class="rv">${r.status}</div><div class="rs">${r.overall.toFixed(1)}</div></div>`}).join('')}</div>`}
function suggest(v){let b=document.getElementById('suggest'),q=v.trim().toLowerCase();if(!q){b.classList.remove('show');return}let a=games.filter(x=>x.name.toLowerCase().includes(q)).slice(0,8);b.innerHTML=a.map(x=>`<div class="srow" onclick="selectGame('${x.id}')"><img src="${x.img}"><div class="sname">${x.name}</div><div class="sscore">${aggregate(x).score.toFixed(1)}</div></div>`).join('')||'<div style="padding:14px;font-size:.72rem">نتیجه‌ای پیدا نشد</div>';b.classList.add('show')}
function selectGame(id){document.getElementById('suggest').classList.remove('show');document.getElementById('search').value='';go('game:'+id)}function searchKey(e){if(e.key==='Enter'){let q=e.target.value.toLowerCase(),x=games.find(g=>g.name.toLowerCase().includes(q));if(x)selectGame(x.id)}}
function pick(el,sel){document.querySelector(sel).querySelectorAll('.sel').forEach(x=>x.classList.remove('on'));el.classList.add('on')}function updateScores(){let s=[...document.querySelectorAll('.scoreSlider')];s.forEach(x=>x.nextElementSibling.textContent=(+x.value).toFixed(1));document.getElementById('overall').textContent=(s.reduce((a,x)=>a+(+x.value),0)/s.length).toFixed(1)}
function go(r){location.hash=r;window.scrollTo({top:0,behavior:'smooth'})}function render(){let r=location.hash.slice(1)||'home',h=r==='home'?home():r==='discover'?discover():r==='rankings'?rankings():r==='my'?myPage():r.startsWith('game:')?gamePage(r.split(':')[1]):r.startsWith('rate:')?ratePage(r.split(':')[1]):home();document.getElementById('app').innerHTML=h}
function openNameModal(force=false){if(force||!localStorage.getItem(NAME)){let m=document.getElementById('nameModal');document.getElementById('displayName').value=localStorage.getItem(NAME)||'';m.classList.add('show')}}
function saveName(){let v=document.getElementById('displayName').value.trim();if(!v)return;localStorage.setItem(NAME,v);document.getElementById('nameModal').classList.remove('show');syncName()}
function syncName(){let n=localStorage.getItem(NAME)||'Guest';document.getElementById('uname').textContent=n;document.getElementById('avatar').textContent=n.charAt(0).toUpperCase()}
window.addEventListener('hashchange',render);document.addEventListener('click',e=>{if(!e.target.closest('.search'))document.getElementById('suggest')?.classList.remove('show')});render();syncName();openNameModal();
</script>
