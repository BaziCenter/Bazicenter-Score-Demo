/* Animated white line around game covers */
.cover{isolation:isolate;overflow:visible;background:transparent}
.cover img{border-radius:17px;display:block;position:relative;z-index:1}
.cover::before{content:"";position:absolute;inset:-2px;border-radius:19px;padding:2px;background:conic-gradient(from 0deg,transparent 0 74%,rgba(255,255,255,.25) 80%,#fff 88%,rgba(255,255,255,.35) 94%,transparent 100%);opacity:0;z-index:0;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.game:hover .cover::before{opacity:1;animation:coverOrbit 1.35s linear infinite}
@keyframes coverOrbit{to{transform:rotate(360deg)}}
.cover .scoreBadge{z-index:3}
.gname{color:#fff}.game:hover .gname{color:#fff}


/* Interaction + ranking refinements */
.accountActions{display:flex;align-items:center;gap:8px}
.noticeBtn{position:relative;width:42px;height:42px;border:0;border-radius:14px;background:#090a0c;color:#fff;display:grid;place-items:center;cursor:pointer}
.noticeBtn:hover{background:var(--blue)}.noticeBtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.noticeBtn span{position:absolute;top:-5px;left:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--blue);color:#fff;border:2px solid #fff;font:800 10px Inter;display:grid;place-items:center}
.rankFilters{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px;margin-bottom:18px;padding:16px;background:#f3f3f4;border-radius:22px}
.rankFilters label{font-size:.68rem;font-weight:800;color:#333;display:grid;gap:7px}.rankFilters select{height:44px;border:1px solid #dfe2e7;border-radius:13px;background:#fff;padding:0 12px;outline:none}
.segbar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;direction:ltr}
.seg{height:10px;border-radius:999px;background:#dfe2e8;overflow:hidden;display:block}
.seg i{display:block;height:100%;background:#090a0c;border-radius:inherit}
.barRow{grid-template-columns:110px 1fr 42px}
.cover::before{inset:-2px;border-radius:22px;background:linear-gradient(var(--blue),var(--blue)) top left/0 3px no-repeat,linear-gradient(var(--blue),var(--blue)) top right/3px 0 no-repeat,linear-gradient(var(--blue),var(--blue)) bottom right/0 3px no-repeat,linear-gradient(var(--blue),var(--blue)) bottom left/3px 0 no-repeat;filter:drop-shadow(0 0 4px rgba(47,111,255,.28))}
.game:hover .cover::before{opacity:1;animation:traceCoverOnce .58s ease-out forwards!important}

/* === FarsiSaz-inspired white / black / blue visual direction === */
:root{
  --blue:#2f6fff;
  --blue2:#1554e8;
  --ink:#07080b;
  --muted:#747b88;
  --line:#e7e9ee;
  --surface:#f5f5f6;
  --surface2:#ededf0;
  --black:#08090b;
}
body{
  background:#fff;
  color:var(--ink);
  min-height:100vh;
}
header{
  background:rgba(255,255,255,.97);
  border-bottom:1px solid #eceef2;
  box-shadow:none;
}
.brand{color:#050608;letter-spacing:-.03em}
.brand span{color:var(--blue)}
.navlinks{gap:8px}
.navlinks button{
  background:#090a0c;
  color:#fff;
  border-radius:14px;
  padding:10px 15px;
}
.navlinks button:hover{background:var(--blue);color:#fff}
.userMini{
  background:#090a0c;
  color:#fff;
  padding:7px 12px 7px 8px;
  border-radius:15px;
}
.avatar{
  background:var(--blue);
  color:#fff;
}
.search input{
  background:#fff;
  color:#101217;
  border:1px solid #dfe3e9;
  box-shadow:0 8px 24px rgba(12,18,30,.06);
}
.search input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(47,111,255,.11);
}
.suggest{
  background:#fff;
  color:#111;
  border-color:#e3e6eb;
}
.srow:hover{background:#f4f6fa}
.topline h1,.head h2{color:#050608}
.topline p,.head p,.gmeta{color:#7a818d}
.quick button,.chip{
  background:#090a0c;
  color:#fff;
  border:1px solid #090a0c;
  box-shadow:0 8px 18px rgba(0,0,0,.08);
}
.quick button:hover,.chip:hover{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}
.more{
  color:#111;
  background:#f1f2f4;
  border-radius:999px;
  padding:7px 11px;
}
.more:hover{background:var(--blue);color:#fff}
.gname{color:#07080b}
.game:hover .gname{color:#07080b}
.cover{
  overflow:visible;
  border-radius:20px;
  background:transparent;
  box-shadow:0 13px 30px rgba(9,15,30,.13);
  transform:translateZ(0);
}
.cover img{
  border-radius:20px;
  background:#eee;
}
.game:hover .cover{
  transform:translateY(-5px);
  box-shadow:0 19px 42px rgba(9,15,30,.18);
}
/* Score: only one number, styled like a small black control */
.scoreBadge{
  width:54px;
  height:54px;
  min-width:54px;
  display:grid;
  place-items:center;
  right:10px;
  bottom:10px;
  padding:0;
  border-radius:16px;
  background:#08090b;
  border:0;
  box-shadow:0 9px 25px rgba(0,0,0,.25);
}
.scoreBadge b{
  color:#fff;
  font:900 1.12rem Inter;
}
.scoreBadge span{display:none!important}

/* The hover line is DRAWN around the cover — nothing rotates */
.cover::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:23px;
  z-index:4;
  pointer-events:none;
  opacity:0;
  padding:0;
  transform:none!important;
  -webkit-mask:none!important;
  mask:none!important;
  background:
    linear-gradient(#fff,#fff) top left / 0 3px no-repeat,
    linear-gradient(#fff,#fff) top right / 3px 0 no-repeat,
    linear-gradient(#fff,#fff) bottom right / 0 3px no-repeat,
    linear-gradient(#fff,#fff) bottom left / 3px 0 no-repeat;
  filter:drop-shadow(0 0 5px rgba(47,111,255,.75));
}
.game:hover .cover::before{
  opacity:1;
  animation:traceCover 1.15s linear infinite!important;
}
@keyframes traceCover{
  0%{
    background-size:0 3px,3px 0,0 3px,3px 0;
  }
  24%{
    background-size:100% 3px,3px 0,0 3px,3px 0;
  }
  49%{
    background-size:100% 3px,3px 100%,0 3px,3px 0;
  }
  74%{
    background-size:100% 3px,3px 100%,100% 3px,3px 0;
  }
  100%{
    background-size:100% 3px,3px 100%,100% 3px,3px 100%;
  }
}

/* Home / community panels */
.activityGrid .feed,
.sidePanel,
.rankTable,
.review{
  background:var(--surface);
  color:#0b0c0f;
  border:0;
  border-radius:24px;
  box-shadow:none;
}
.feedItem,.rankRow{
  border-bottom:1px solid #dedfe4;
}
.feedAvatar{
  background:#090a0c;
  color:#fff;
}
.feedMain,.sidePanel h3,.rankName,.reviewGame,.review p{
  color:#0b0c0f;
}
.feedTime,.reviewUser,.rankRow .rv,.sidePanel .info span{
  color:#7a818d;
}
.feedScore,.rankScore,.reviewScore{
  color:var(--blue);
}
.sidePanel{
  background:#f3f3f4;
}
.sidePanel .info{
  background:#fff;
  color:#08090b;
  border:1px solid #e1e3e8;
}

/* Game page: large light-gray editorial surface, black controls, blue accent */
.gameHero{
  background:#f3f3f4;
  color:#08090b;
  border:0;
  border-radius:34px;
  padding:28px;
  box-shadow:none;
}
.gameHero .summary{color:#4e5561}
.gameHero .info{
  background:#fff;
  color:#08090b;
  border:1px solid #e1e3e8;
}
.gameHero .info span{color:#818895}
.gameHero .tag{
  background:#090a0c;
  color:#fff;
  border:0;
}
.btn{
  background:#090a0c;
  color:#fff;
  border:0;
  box-shadow:0 8px 18px rgba(0,0,0,.09);
}
.btn:hover{background:var(--blue)}
.scoreBoard{
  background:#fff;
  border:0;
  border-radius:26px;
  color:#0b0c0f;
  box-shadow:0 10px 28px rgba(14,20,32,.06);
}
.big{
  background:#090a0c;
  border:0;
  border-radius:22px;
  padding:22px 14px;
}
.big b{color:#fff}
.big small{color:#b9bec7}
.big small:first-child{color:var(--blue)!important}
.bar{background:#e7e8ec}
.fill{background:var(--blue)}
.barNum{color:#0b0c0f}

/* User scores below each game */
.voters{
  background:#fff;
  border:0;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 10px 28px rgba(14,20,32,.06);
}
.votersHead{border-bottom:1px solid #e4e6ea}
.votersHead h3,.voterName{color:#0a0b0d}
.votersHead span,.voterMeta,.arrow{color:#79818e}
.voter{border-bottom:1px solid #e7e9ed}
.voterAvatar{background:#090a0c;color:#fff}
.voterOverall{color:var(--blue)}
.userCat,.userReview{
  background:#f4f4f5;
  border:0;
  color:#101116;
}
.userCat span{color:#7b828e}
.userCat b{color:var(--blue)}

/* Rating / profile */
.rateBox{
  background:#f4f4f5;
  color:#08090b;
  border:0;
  border-radius:28px;
  box-shadow:none;
}
.rateHead{
  background:#090a0c;
  color:#fff;
}
.rateHead .live b{color:var(--blue)}
.rateHead .live span{color:#c4c7ce}
.form{
  background:#f4f4f5;
  color:#090a0c;
}
.formSec{border-color:#dedfe3}
.field,.sel{
  background:#fff;
  color:#11131a;
  border:1px solid #dfe2e7;
}
.sel.on{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}
.saved{
  background:#fff;
  color:#101116;
  border:1px solid #dfe2e7;
}
.profileStats .info{
  background:#f3f3f4;
  color:#0b0c0f;
  border:0;
  box-shadow:none;
}
.profileStats .info span{color:#7c838f}

/* Edit button must always read clearly */
.editBtn{
  border:0;
  background:#090a0c;
  color:#fff;
  border-radius:13px;
  padding:10px 16px;
  font-weight:900;
  font-size:.72rem;
  cursor:pointer;
  box-shadow:none;
}
.editBtn:hover{
  background:var(--blue);
  color:#fff;
  transform:none;
}

/* Modal */
.modal{background:rgba(0,0,0,.56)}
.modalCard{
  background:#fff;
  color:#0b0c0f;
  border:0;
}
.modalCard p{color:#6d7480}


/* === final interaction fixes === */
.big small:first-child{color:#fff!important}

/* Cover hover: no rotation, no looping animation. A blue frame simply appears around the exact cover. */
.cover::before{
  content:""!important;
  position:absolute!important;
  inset:-3px!important;
  border-radius:23px!important;
  background:none!important;
  border:3px solid var(--blue)!important;
  box-sizing:border-box!important;
  opacity:0!important;
  transform:scale(.985)!important;
  transition:opacity .16s ease,transform .18s ease!important;
  animation:none!important;
  filter:none!important;
  z-index:4!important;
  pointer-events:none!important;
}
.game:hover .cover::before{
  opacity:1!important;
  transform:scale(1)!important;
  animation:none!important;
}

/* Rating input uses the same five-piece score language as the displayed score */
.scoreInputs{display:grid;gap:14px}
.scoreInputRow{display:grid;grid-template-columns:130px minmax(260px,1fr) 54px;gap:16px;align-items:center}
.scoreInputRow label{font-weight:800;font-size:.78rem}
.scoreInput{position:relative;min-height:32px;display:flex;align-items:center}
.scoreInput .segbar{width:100%}
.scoreInput .seg{height:13px;background:#dfe2e7}
.scoreInput .seg i{background:var(--blue)}
.scoreInput .scoreSlider{position:absolute;inset:-10px 0;width:100%;height:calc(100% + 20px);opacity:0;cursor:pointer;direction:ltr;z-index:5}
.scoreInputRow .slval{font:900 .9rem Inter;color:var(--blue);text-align:center}
.formHint{font-size:.64rem;color:#737b87;margin:-3px 0 11px}

/* Game names are vertically centered in all ranking/profile rows */
.rankRow{min-height:88px;align-items:center}
.rankRow>div:nth-child(3),.rankGameInfo{height:100%;display:flex;flex-direction:column;justify-content:center;align-self:stretch}
.rankRow .rn{display:flex;align-items:center;min-height:26px;cursor:pointer}
.profileRankRow .editBtn{align-self:center}

/* Public profile review list + filters */
.profileReviewList{display:grid;gap:12px}
.profileReviewItem{display:grid;grid-template-columns:78px 1fr;gap:15px;background:#f3f3f4;border-radius:20px;padding:13px;cursor:pointer}
.profileReviewItem:hover{background:#eceef2}
.profileReviewItem>img{width:78px;height:104px;object-fit:cover;border-radius:13px}
.profileReviewBody{min-width:0;display:flex;flex-direction:column;justify-content:center}
.profileReviewTop{display:flex;justify-content:space-between;gap:14px;align-items:start}
.profileReviewBody p{margin:10px 0 0;font-size:.72rem;line-height:1.9;color:#424954}
.userFilters{margin-top:4px}

/* Keep segmented score display blue in the game page */
.scoreBoard .seg i{background:var(--blue)}
.scoreBoard .seg{background:#e0e3e8}

@media(max-width:650px){
  .scoreInputRow{grid-template-columns:90px 1fr 42px;gap:9px}
  .profileReviewItem{grid-template-columns:60px 1fr}
  .profileReviewItem>img{width:60px;height:82px}
}


/* Review formatting toolbar */
.reviewToolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.reviewToolbar button,.reviewToolbar select,.colorTool{height:38px;border:1px solid #dfe2e7;background:#fff;color:#111;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 11px;font-weight:800;cursor:pointer}
.reviewToolbar button{min-width:38px}
.reviewToolbar button:hover,.reviewToolbar select:hover,.colorTool:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,255,.08)}
.reviewToolbar select{font-size:.68rem;outline:none}
.colorTool{gap:7px;font-size:.66rem}.colorTool input{width:22px;height:22px;border:0;padding:0;background:transparent;cursor:pointer}
.reviewEditor{font-size:.82rem;line-height:2;min-height:220px}
.editorHint{font-size:.62rem;color:#777f8b;margin-top:7px}
.reviewRendered{white-space:normal;line-height:1.9}

/* Every list row now uses explicit grid areas. This removes the drifting game-title problem. */
.rankRow.gameRankRow{
  display:grid!important;
  grid-template-columns:82px 88px minmax(150px,220px) minmax(220px,1fr) 64px 54px!important;
  grid-template-areas:"score year meta title cover rank"!important;
  gap:16px!important;
  min-height:104px!important;
  align-items:center!important;
  direction:ltr!important;
  padding:10px 18px!important;
}
.gameRankRow .rankNo{grid-area:rank;display:flex;align-items:center;justify-content:center;height:100%;direction:ltr}
.gameRankRow .rankCover{grid-area:cover;width:58px;height:78px;object-fit:cover;border-radius:10px;justify-self:center}
.gameRankRow .rankTitleBlock{grid-area:title;display:flex!important;align-items:center!important;justify-content:flex-start!important;height:100%!important;min-width:0}
.gameRankRow .rn{direction:ltr;text-align:left;display:flex!important;align-items:center!important;height:100%;margin:0;font:800 .74rem Inter;white-space:normal}
.gameRankRow .rankMetaBlock{grid-area:meta;display:flex;align-items:center;justify-content:flex-start;height:100%;direction:rtl;text-align:right;color:#7b8390;font-size:.66rem}
.gameRankRow .rankYear{grid-area:year;display:flex;align-items:center;justify-content:center;height:100%;font:600 .67rem Inter;color:#818895}
.gameRankRow .rs{grid-area:score;display:flex;align-items:center;justify-content:center;height:100%;font:900 1rem Inter;color:var(--blue)}

/* Profile rows use their own explicit columns too */
.rankRow.profileRankRow{
  display:grid!important;
  grid-template-columns:82px 92px minmax(130px,190px) minmax(220px,1fr) 64px!important;
  grid-template-areas:"score edit meta title cover rank"!important;
  gap:16px!important;
  min-height:104px!important;
  align-items:center!important;
  direction:ltr!important;
  padding:10px 18px!important;
}
.profileRankRow .rankNo{grid-area:rank;display:flex;align-items:center;justify-content:center;height:100%}
.profileRankRow .rankCover{grid-area:cover;width:58px;height:78px;object-fit:cover;border-radius:10px;justify-self:center}
.profileRankRow .profileTitleBlock{grid-area:title;display:flex;align-items:center;height:100%;min-width:0}
.profileRankRow .profileTitleBlock .rn{direction:ltr;text-align:left;font:800 .74rem Inter;display:flex;align-items:center;height:100%;margin:0}
.profileRankRow .profileMetaBlock{grid-area:meta;display:flex;align-items:center;height:100%;direction:rtl;text-align:right;color:#7b8390;font-size:.66rem}
.profileRankRow .editBtn{grid-area:edit;align-self:center;justify-self:center}
.profileRankRow .rs{grid-area:score;display:flex;align-items:center;justify-content:center;height:100%;font:900 1rem Inter;color:var(--blue)}

@media(max-width:900px){

.rankRow.profileRankRow{

  grid-template-columns:82px 92px minmax(220px,300px) minmax(340px,1fr) 72px 48px!important;

.profileRankRow .profileTitleBlock{grid-area:title;display:flex!important;align-items:center!important;justify-content:flex-start!important;height:100%!important}
.profileRankRow .profileTitleBlock .rn{direction:ltr;text-align:left;font:800 .78rem Inter;display:flex!important;align-items:center!important;height:100%!important;justify-content:flex-start!important}
.profileRankRow .profileMetaBlock{grid-area:meta;display:flex!important;align-items:center!important;justify-content:flex-end!important;height:100%!important}

function cancelRating(id){sessionStorage.removeItem('bc_edit_rating');go('game:'+id)}
function editRating(rid){let r=saved().find(x=>x.id===rid);if(!r)return;sessionStorage.setItem('bc_edit_rating',rid);go('rate:'+r.gameId)}
function profilePage(){let a=saved(),filtered=filterUserRows([...a]),name=localStorage.getItem(NAME)||'Guest',avg=a.length?a.reduce((s,r)=>s+r.overall,0)/a.length:0,totalHours=a.reduce((s,r)=>s+r.hours,0);return `<div class="topline"><div><h1>پروفایل ${name}</h1><p>پروفایل آزمایشی کاربر و تمام امتیازهای ثبت‌شده</p></div><button class="chip" onclick="openNameModal(true)">ویرایش نام نمایشی</button></div><div class="profileStats"><div class="info"><span>بازی‌های امتیاز داده‌شده</span><b>${fmt(a.length)}</b></div><div class="info"><span>میانگین امتیازهای من</span><b>${a.length?avg.toFixed(1):'—'}</b></div><div class="info"><span>مجموع زمان ثبت‌شده</span><b>${fmt(totalHours)} ساعت</b></div></div><section class="section"><div class="head"><div><h2>دنبال‌شده‌ها</h2><p>کاربرانی که نقدهایشان را دنبال می‌کنید</p></div></div><div class="followingChips">${followed().length?followed().map(n=>`<button onclick="go('user:${encodeURIComponent(n)}')">${n}</button>`).join(''):'<span>هنوز کسی را دنبال نکرده‌اید.</span>'}</div></section><section class="section"><div class="head"><div><h2>امتیازهای من</h2><p>فیلتر بر اساس سال، پلتفرم و امتیاز؛ ویرایش هر مورد از همین‌جا.</p></div></div>${a.length?userFilterMarkup(a):''}${filtered.length?`<div class="rankTable profileRatings">${filtered.map((r,i)=>{let x=g(r.gameId);return `<div class="rankRow profileRankRow"><div class="rs">${r.overall.toFixed(1)}</div><button class="editBtn" onclick="editRating('${r.id}')">ویرایش</button><div class="profileTitleBlock"><div class="rn" onclick="go('game:${x.id}')">${x.name}</div></div><div class="profileMetaBlock"><div class="rankMetaPills">${voterMeta(r)}</div></div><img class="rankCover" src="${x.img}"><div class="rankNo">#${i+1}</div></div>`}).join('')}</div>`:'<div class="saved show">موردی با این فیلترها پیدا نشد.</div>'}</section>`}
function publicUserPage(name){name=decodeURIComponent(name);let reviews=communityRatings.filter(r=>r.username===name),filtered=filterUserRows([...reviews]),score=reviews.length?reviews.reduce((s,r)=>s+r.overall,0)/reviews.length:0;return `<div class="publicProfile"><div class="profileHero"><div class="profileAvatar">${name.charAt(0).toUpperCase()}</div><div><h1>${name}</h1><p>${reviews.length} نقد و امتیاز نمونه · میانگین ${reviews.length?score.toFixed(1):'—'}</p></div><button class="followBtn ${isFollowing(name)?'on':''}" onclick="toggleFollow('${name}')">${isFollowing(name)?'دنبال می‌کنید':'دنبال کردن'}</button></div><section class="section"><div class="head"><div><h2>نقدها و امتیازها</h2><p>فیلتر بر اساس سال، پلتفرم و امتیاز</p></div></div>${reviews.length?userFilterMarkup(reviews):''}<div class="profileReviewList">${filtered.map(r=>{let x=g(r.gameId);return `<article class="profileReviewItem" onclick="go('game:${x.id}')"><img src="${x.img}"><div class="profileReviewBody"><div class="profileReviewTop"><div><div class="reviewGame">${x.name}</div><div class="reviewUser">${r.time||''}</div></div><div class="reviewScore">${r.overall.toFixed(1)}</div></div><div class="voterMetaChips">${voterMeta(r)}</div><p class="reviewRendered">${renderReview(r.review||'بدون متن نقد')}</p></div></article>`}).join('')||'<div class="saved show">موردی با این فیلترها پیدا نشد.</div>'}</div></section></div>`}
function notificationsPage(){let names=followed(),items=communityRatings.filter(r=>names.includes(r.username));return `<div class="topline"><div><h1>اعلان‌ها</h1><p>وقتی کاربری که دنبال می‌کنید نقد یا امتیاز تازه ثبت کند، اینجا نمایش داده می‌شود.</p></div></div>${names.length?`<div class="notificationList">${items.map(r=>{let x=g(r.gameId);return `<div class="notificationItem" onclick="go('game:${x.id}')"><div class="feedAvatar">${r.username[0]}</div><div><b>${r.username}</b> برای <span class="en">${x.name}</span> نقد/امتیاز ثبت کرده است.<small>${r.time}</small></div><strong>${r.overall.toFixed(1)}</strong></div>`}).join('')||'<div class="saved show">فعلاً فعالیت تازه‌ای از کاربران دنبال‌شده وجود ندارد.</div>'}</div>`:'<div class="saved show">هنوز کسی را دنبال نکرده‌اید. از صفحه بازی روی نام کاربر بروید و «دنبال کردن» را بزنید.</div>'}`}
function suggest(v){let b=document.getElementById('suggest'),q=v.trim().toLowerCase();if(!q){b.classList.remove('show');return}let a=games.filter(x=>x.name.toLowerCase().includes(q)).slice(0,8);b.innerHTML=a.map(x=>`<div class="srow" onclick="selectGame('${x.id}')"><img src="${x.img}"><div class="sname">${x.name}</div><div class="sscore">${aggregate(x).score.toFixed(1)}</div></div>`).join('')||'<div style="padding:14px;font-size:.72rem">نتیجه‌ای پیدا نشد</div>';b.classList.add('show')}
function selectGame(id){document.getElementById('suggest').classList.remove('show');document.getElementById('search').value='';go('game:'+id)}function searchKey(e){if(e.key==='Enter'){let q=e.target.value.toLowerCase(),x=games.find(g=>g.name.toLowerCase().includes(q));if(x)selectGame(x.id)}}
function pick(el,sel){document.querySelector(sel).querySelectorAll('.sel').forEach(x=>x.classList.remove('on'));el.classList.add('on')}function repaintScoreInput(input){let v=+input.value,segs=input.closest('.scoreInput').querySelectorAll('.seg i');segs.forEach((el,i)=>{el.style.width=Math.max(0,Math.min(100,(v-i*2)/2*100))+'%'});input.closest('.scoreInputRow').querySelector('.slval').textContent=v.toFixed(1)}function updateScores(changed){if(changed)repaintScoreInput(changed);let s=[...document.querySelectorAll('.scoreSlider')];document.getElementById('overall').textContent=(s.reduce((a,x)=>a+(+x.value),0)/s.length).toFixed(1)}
function go(r){location.hash=r;window.scrollTo({top:0,behavior:'smooth'})}function render(){let r=location.hash.slice(1)||'home',h=r==='home'?home():r==='discover'?discover():r==='rankings'?rankings():r==='profile'?profilePage():r==='notifications'?notificationsPage():r.startsWith('user:')?publicUserPage(r.slice(5)):r.startsWith('game:')?gamePage(r.split(':')[1]):r.startsWith('rate:')?ratePage(r.split(':')[1]):home();document.getElementById('app').innerHTML=h}
function openNameModal(force=false){if(force||!localStorage.getItem(NAME)){let m=document.getElementById('nameModal');document.getElementById('displayName').value=localStorage.getItem(NAME)||'';m.classList.add('show')}}
function saveName(){let v=document.getElementById('displayName').value.trim();if(!v)return;localStorage.setItem(NAME,v);document.getElementById('nameModal').classList.remove('show');syncName();render()}
function syncName(){let n=localStorage.getItem(NAME)||'Guest';document.getElementById('uname').textContent=n;document.getElementById('avatar').textContent=n.charAt(0).toUpperCase()}function syncHeader(){let c=document.getElementById('noticeCount');if(c)c.textContent=communityRatings.filter(r=>followed().includes(r.username)).length}
window.addEventListener('hashchange',render);document.addEventListener('click',e=>{if(!e.target.closest('.search'))document.getElementById('suggest')?.classList.remove('show')});render();syncName();syncHeader();openNameModal();
</script>
</body></html>
