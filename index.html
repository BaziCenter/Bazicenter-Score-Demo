const cats=['گیم‌پلی','داستان','گرافیک هنری','گرافیک فنی','موسیقی'];
const LS='bc_score_demo_ratings_v1';
const saved=()=>JSON.parse(localStorage.getItem(LS)||'[]');
const setSaved=a=>localStorage.setItem(LS,JSON.stringify(a));
const g=id=>games.find(x=>x.id===id);
const fmt=n=>new Intl.NumberFormat('fa-IR').format(n);
function userRatings(id){return saved().filter(r=>r.gameId===id)}
function aggregate(x){const a=userRatings(x.id);if(!a.length)return {score:x.score,ratings:x.ratings,cats:x.cats,hours:x.hours};const sc=a.reduce((s,r)=>s+r.overall,0)/a.length;const cc=cats.map((_,i)=>a.reduce((s,r)=>s+r.scores[i],0)/a.length);const hh=a.reduce((s,r)=>s+r.hours,0)/a.length;return {score:sc,ratings:x.ratings+a.length,cats:cc,hours:hh}}
function card(x){let a=aggregate(x);return `<div class="game" onclick="go('game:${x.id}')"><div class="cover"><img src="${x.img}"><div class="score"><b>${a.score.toFixed(1)}</b><small>/10</small></div></div><div class="gname">${x.name}</div><div class="gmeta">${x.year} · ${fmt(a.ratings)} رأی</div></div>`}
function home(){let news=games.filter(x=>x.status==='new'),top=[...games].sort((a,b)=>aggregate(b).score-aggregate(a).score).slice(0,7),pop=games.filter(x=>x.status==='popular').slice(0,7);let f=news[0];return `<div class="hero"><div><h1>امتیاز کاربران بازی‌سنتر</h1><p>جستجو کنید، امتیاز بدهید و خروجی آماده انجمن بگیرید.</p></div></div>
<div class="feature"><div class="featureMain" onclick="go('game:${f.id}')"><img src="${f.img}"><div class="fcontent"><div class="ftitle">${f.name}</div><div class="fscore">${aggregate(f).score.toFixed(1)} <span style="font-size:12px">/ 10</span></div></div></div><div class="side">${news.slice(1,3).map(x=>`<div class="sideCard" onclick="go('game:${x.id}')"><img src="${x.img}"><div><div class="n">${x.name}</div><div class="m">${x.release}</div><div style="margin-top:12px;font:800 18px Inter;color:var(--b)">${aggregate(x).score.toFixed(1)}</div></div></div>`).join('')}</div></div>
${section('بازی‌های جدید','تازه‌ترین بازی‌های قابل امتیازدهی',news)}
${section('محبوب‌ترین‌ها','بازی‌هایی که بیشتر مورد توجه کاربران قرار گرفته‌اند',pop)}
${section('بالاترین امتیاز کاربران','بر اساس میانگین امتیاز جامعه',top)}`}
function section(t,s,arr){return `<section class="section"><div class="head"><div><h2>${t}</h2><p>${s}</p></div></div><div class="grid">${arr.map(card).join('')}</div></section>`}
function discover(){return `<section class="section"><div class="head"><div><h2>همه بازی‌ها</h2><p>${games.length} عنوان در نسخه آزمایشی</p></div></div><div class="grid">${games.map(card).join('')}</div></section>`}
function gamePage(id){let x=g(id);if(!x)return home();let a=aggregate(x),mine=userRatings(id);return `<div class="gameHero"><div class="poster"><img src="${x.img}"></div><div><div style="display:flex;justify-content:space-between;gap:14px;align-items:start"><div><h1 class="title">${x.name}</h1><div style="font-size:10px;color:var(--muted)">${x.genres.join('، ')}</div></div><button class="btn" onclick="go('rate:${x.id}')">ثبت امتیاز</button></div><p class="summary">${x.summary}</p><div class="infoGrid"><div class="info"><span>تاریخ انتشار</span><b>${x.release}</b></div><div class="info"><span>سازنده</span><b class="en">${x.dev}</b></div><div class="info"><span>ناشر</span><b class="en">${x.pub}</b></div><div class="info"><span>ژانر</span><b>${x.genres.join('، ')}</b></div><div class="info"><span>حالت بازی</span><b>${x.modes}</b></div><div class="info"><span>میانگین زمان تجربه</span><b>${a.hours.toFixed(1)} ساعت</b></div></div><div class="tags">${x.platforms.map(p=>`<span class="tag">${p}</span>`).join('')}</div><div class="scoreBoard"><div class="big"><b>${a.score.toFixed(1)}</b><small>بر اساس ${fmt(a.ratings)} رأی</small></div><div class="bars">${cats.map((c,i)=>`<div class="barRow"><span>${c}</span><div class="bar"><div class="fill" style="width:${a.cats[i]*10}%"></div></div><span class="barNum">${a.cats[i].toFixed(1)}</span></div>`).join('')}</div></div>${mine.length?`<div class="saved show">شما برای این بازی ${mine.length} امتیاز آزمایشی ثبت کرده‌اید. این داده فعلاً در مرورگر شما ذخیره می‌شود.</div>`:''}</div></div>`}
function ratePage(id){let x=g(id);return `<div class="rateBox"><div class="rateHead"><img src="${x.img}"><div><div class="rateTitle">${x.name}</div><div style="font-size:9px;color:var(--muted);margin-top:4px">امتیاز و تجربه خود را ثبت کنید</div></div><div class="live"><b id="overall">8.4</b><span>امتیاز نهایی / 10</span></div></div><div class="form">
<div class="formSec"><h3>نام کاربری آزمایشی</h3><input id="username" class="field" value="Guest"></div>
<div class="formSec"><h3>پلتفرم‌هایی که بازی کرده‌اید</h3><div class="selects" id="plats">${x.platforms.map((p,i)=>`<button class="sel ${i===0?'on':''}" onclick="this.classList.toggle('on')">${p}</button>`).join('')}</div></div>
<div class="formSec"><h3>وضعیت تجربه</h3><div class="selects" id="status"><button class="sel on" onclick="pick(this,'#status')">تمام‌شده</button><button class="sel" onclick="pick(this,'#status')">در حال تجربه</button><button class="sel" onclick="pick(this,'#status')">رهاشده</button></div></div>
<div class="formSec"><h3>زمان تجربه</h3><input id="hours" class="field" type="number" value="24" min="0" style="width:120px"> ساعت</div>
<div class="formSec"><h3>امتیاز بخش‌ها</h3>${cats.map((n,i)=>`<div class="sl"><label>${n}</label><input class="scoreSlider" type="range" min="0" max="10" step="0.5" value="${[8.5,8,9,8,8.5][i]}" oninput="updateScores()"><span class="slval">${[8.5,8,9,8,8.5][i].toFixed(1)}</span></div>`).join('')}</div>
<div class="formSec"><h3>نقد شما</h3><textarea id="review" class="field textarea" placeholder="نظر خود را درباره بازی بنویسید..."></textarea></div>
<div style="display:flex;justify-content:flex-end;gap:8px;padding-top:15px"><button class="chip" onclick="go('game:${x.id}')">انصراف</button><button class="btn" onclick="saveRating('${x.id}')">ثبت امتیاز و ساخت BBCode</button></div>
<div id="savedMsg" class="saved"></div></div></div>`}
function saveRating(id){let x=g(id),sl=[...document.querySelectorAll('.scoreSlider')],scores=sl.map(e=>+e.value),overall=scores.reduce((a,b)=>a+b,0)/scores.length,platforms=[...document.querySelectorAll('#plats .on')].map(e=>e.textContent),status=document.querySelector('#status .on')?.textContent||'',hours=+document.getElementById('hours').value||0,review=document.getElementById('review').value.trim(),username=document.getElementById('username').value.trim()||'Guest';let arr=saved();let rid=Date.now().toString(36);arr.push({id:rid,gameId:id,username,platforms,status,hours,scores,overall,review,createdAt:new Date().toISOString()});setSaved(arr);let base=location.href.split('#')[0],gameUrl=base+'#game:'+id,bb=`[CENTER][URL='${gameUrl}'][IMG]${x.img}[/IMG][/URL]\n\n[URL='${gameUrl}'][B]${x.name}[/B][/URL]\n[B]امتیاز نهایی: ${overall.toFixed(1)}/10[/B][/CENTER]\n\n[B]گیم‌پلی:[/B] ${scores[0].toFixed(1)}\n[B]داستان:[/B] ${scores[1].toFixed(1)}\n[B]گرافیک هنری:[/B] ${scores[2].toFixed(1)}\n[B]گرافیک فنی:[/B] ${scores[3].toFixed(1)}\n[B]موسیقی:[/B] ${scores[4].toFixed(1)}\n\n[B]پلتفرم:[/B] ${platforms.join(', ')}\n[B]زمان تجربه:[/B] ${hours} ساعت\n[B]وضعیت:[/B] ${status}\n\n${review}\n\n[B][جهت ثبت در پست اول][/B]`;document.getElementById('savedMsg').classList.add('show');document.getElementById('savedMsg').innerHTML=`<b>ثبت شد.</b> امتیاز در مرورگر شما ذخیره شد و میانگین صفحه بازی همین حالا تغییر می‌کند.<br><br><button class="btn" onclick="copyBB()">کپی BBCode برای انجمن</button><textarea id="bbcode" class="field bb">${bb.replace(/</g,'&lt;')}</textarea><br><button class="chip" onclick="go('game:${id}')">مشاهده صفحه بازی</button>`;window.__bb=bb}
async function copyBB(){await navigator.clipboard.writeText(window.__bb||'');alert('BBCode کپی شد')}
function myPage(){let a=saved();if(!a.length)return '<div class="saved show">هنوز در این مرورگر امتیازی ثبت نشده است.</div>';return `<section class="section"><div class="head"><div><h2>امتیازهای من</h2><p>داده‌های آزمایشی ذخیره‌شده در همین مرورگر</p></div></div>${a.slice().reverse().map(r=>{let x=g(r.gameId);return `<div style="display:grid;grid-template-columns:54px 1fr 70px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><img src="${x.img}" style="width:50px;height:68px;object-fit:cover;border-radius:8px"><div><div class="en" style="font-weight:800">${x.name}</div><div style="font-size:9px;color:var(--muted)">${r.platforms.join('، ')} · ${r.hours} ساعت</div></div><div style="font:900 20px Inter;color:var(--b)">${r.overall.toFixed(1)}</div></div>`}).join('')}</section>`}
function suggest(v){let b=document.getElementById('suggest'),q=v.trim().toLowerCase();if(!q){b.classList.remove('show');return}let a=games.filter(x=>x.name.toLowerCase().includes(q)).slice(0,7);b.innerHTML=a.map(x=>`<div class="srow" onclick="selectGame('${x.id}')"><img src="${x.img}"><div class="sname">${x.name}</div><div class="sscore">${aggregate(x).score.toFixed(1)}</div></div>`).join('')||'<div style="padding:14px;font-size:10px">نتیجه‌ای پیدا نشد</div>';b.classList.add('show')}
function selectGame(id){document.getElementById('suggest').classList.remove('show');document.getElementById('search').value='';go('game:'+id)}
function searchKey(e){if(e.key==='Enter'){let q=e.target.value.toLowerCase(),x=games.find(g=>g.name.toLowerCase().includes(q));if(x)selectGame(x.id)}}
function pick(el,sel){document.querySelector(sel).querySelectorAll('.sel').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
function updateScores(){let s=[...document.querySelectorAll('.scoreSlider')];s.forEach(x=>x.nextElementSibling.textContent=(+x.value).toFixed(1));document.getElementById('overall').textContent=(s.reduce((a,x)=>a+(+x.value),0)/s.length).toFixed(1)}
function go(r){location.hash=r;window.scrollTo({top:0,behavior:'smooth'})}
function render(){let r=location.hash.slice(1)||'home',h=r==='home'?home():r==='discover'?discover():r==='my'?myPage():r.startsWith('game:')?gamePage(r.split(':')[1]):r.startsWith('rate:')?ratePage(r.split(':')[1]):home();document.getElementById('app').innerHTML=h}
window.addEventListener('hashchange',render);document.addEventListener('click',e=>{if(!e.target.closest('.search'))document.getElementById('suggest')?.classList.remove('show')});render();
</script>
</body></html>
